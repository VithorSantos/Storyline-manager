<!DOCTYPE html>
<html lang="pt-BR" data-theme="aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storyline Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-orb o1"></div><div class="bg-orb o2"></div>

<!-- Tela 1: Menu principal -->
<main id="home" class="screen active">
  <div class="home-settings"><select class="themeSel" aria-label="Theme"></select><select class="langSel" aria-label="Language"></select></div>
  <div class="glass home-card">
    <div class="logo">🎬</div>
    <h1>Storyline Manager</h1>
    <p data-i18n="homeDesc"></p>
    <button class="btn primary" id="btnPick" data-i18n="pick"></button>
  </div>
</main>

<!-- Tela 2: Workspace -->
<main id="workspace" class="screen">
  <header class="topbar glass">
    <div class="brand">🎬 Storyline Manager</div>
    <select id="fileSelect" aria-label="Storyline"></select>
    <button class="btn" id="btnRename" aria-label="Rename">✏️</button>
    <button class="btn danger" id="btnDelSt" aria-label="Delete">🗑</button>
    <button class="btn" id="btnNew" data-i18n="newSt"></button>
    <span class="spacer"></span>
    <select class="themeSel" aria-label="Theme"></select>
    <select class="langSel" aria-label="Language"></select>
    <button class="btn primary" id="btnAddSection" data-i18n="addSec"></button>
    <button class="btn success" id="btnSave" data-i18n="save"></button>
  </header>
  <div id="sections"></div>
</main>

<!-- Modal genérico -->
<div id="modal" class="modal">
  <div class="glass modal-box">
    <h3 id="mTitle"></h3>
    <div id="mFields"></div>
    <div class="row"><button class="btn" id="mCancel"></button><button class="btn" id="mAlt" hidden></button><button class="btn primary" id="mOk"></button></div>
  </div>
</div>

<div id="lightbox" class="lightbox"><button class="icon lb-close" id="lbClose" aria-label="Close">✕</button><div class="lb-scroll"><img alt=""></div><small id="lbHint"></small></div>
<div id="pvx" class="lightbox"><button class="icon lb-close" id="pvClose" aria-label="Close">✕</button><div class="pv-box glass"><div class="pv-head"><span id="pvTitle"></span><em id="pvCount"></em></div><textarea id="pvText"></textarea></div></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
